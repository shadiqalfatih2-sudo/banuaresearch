    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--primary);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: var(--white);
      overflow: hidden;
    }

    #app-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--white);
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--primary);
      color: var(--white);
      transition: opacity 240ms ease, visibility 240ms ease;
    }

    .loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-card {
      width: min(420px, 100%);
      text-align: center;
    }

    .loader-logo {
      width: min(300px, 82vw);
      height: 112px;
      margin: 0 auto 24px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      background-color: var(--white);
      background-image: var(--brand-logo-image);
      background-repeat: no-repeat;
      background-position: center;
      background-size: calc(100% - 24px) auto;
      box-shadow: 0 14px 36px rgba(5, 43, 69, 0.28);
    }

    .loader h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: 0.04em;
    }

    .loader p {
      margin: 10px 0 22px;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.6;
    }

    .loading-line {
      width: 100%;
      height: 3px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.18);
    }

    .loading-line::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      background: var(--accent);
      animation: loading 1.1s ease-in-out infinite;
    }

    .fallback {
      position: fixed;
      left: 50%;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 30;
      display: none;
      width: min(430px, calc(100% - 32px));
      padding: 14px 16px;
      transform: translateX(-50%);
      border: 1px solid var(--muted);
      background: var(--white);
      color: var(--dark);
      box-shadow: 0 10px 30px rgba(5, 43, 69, 0.16);
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .fallback.is-visible {
      display: block;
    }

    .fallback a {
      display: inline-block;
      margin-top: 8px;
      padding: 9px 15px;
      background: var(--accent);
      color: var(--dark);
      font-weight: 700;
      text-decoration: none;
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }
      100% {
        transform: translateX(340%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader,
      .loading-line::after {
        transition: none;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <iframe
      id="app-frame"
      title="Banua Research"
      src="https://script.google.com/macros/s/AKfycbzJvM6AunUmPXnvxxhznT696FeRyLpHmzQwlACpp8qgGmGMvcfnHr6SzgneqcGmhcM/exec"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </main>

  <section class="loader" id="loader" aria-live="polite" aria-label="Memuat Banua Research">
    <div class="loader-card">
      <div class="loader-logo" role="img" aria-label="Logo Banua Research"></div>
      <p>Menyiapkan rumah pengetahuan dari daerah.</p>
      <div class="loading-line" aria-hidden="true"></div>
    </div>
  </section>

  <aside class="fallback" id="fallback">
    Halaman membutuhkan waktu lebih lama untuk dimuat.
    <br>
    <a href="https://script.google.com/macros/s/AKfycbzJvM6AunUmPXnvxxhznT696FeRyLpHmzQwlACpp8qgGmGMvcfnHr6SzgneqcGmhcM/exec" target="_self">Buka Banua Research</a>
  </aside>

  <script>
    (function () {
      'use strict';

      var frame = document.getElementById('app-frame');
      var loader = document.getElementById('loader');
      var fallback = document.getElementById('fallback');
      var loaded = false;

      function hideLoader() {
        if (loaded) return;
        loaded = true;
        loader.classList.add('is-hidden');
        fallback.classList.remove('is-visible');
      }

      frame.addEventListener('load', function () {
        window.setTimeout(hideLoader, 350);
      });

      window.setTimeout(function () {
        if (!loaded) {
          fallback.classList.add('is-visible');
        }
      }, 12000);

      window.setTimeout(function () {
        if (!loaded) {
          loader.classList.add('is-hidden');
        }
      }, 18000);
    }());
  </script>
</body>
</html>
